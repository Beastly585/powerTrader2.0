<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Notes — Energy Trader</title>
  <link rel="stylesheet" href="css/styles.css">
  <script>document.documentElement.setAttribute('data-theme',localStorage.getItem('et-theme')||'dark');</script>
  <style>
    .notes-layout { display: grid; grid-template-columns: 220px 1fr; gap: 0; min-height: calc(100vh - 56px); }
    @media(max-width:800px){ .notes-layout { grid-template-columns: 1fr; } }
    .notes-sidebar {
      background: var(--bg1); border-right: 1px solid var(--border);
      padding: 20px 14px; position: sticky; top: 56px;
      height: calc(100vh - 56px); overflow-y: auto;
    }
    .notes-main { padding: 28px; max-width: 800px; }
    .note-sidebar-item {
      padding: 9px 10px; border-radius: var(--r2); cursor: pointer;
      transition: var(--t); margin-bottom: 3px;
      border-left: 2px solid transparent;
    }
    .note-sidebar-item:hover { background: var(--bg2); }
    .note-sidebar-item.active { background: rgba(245,166,35,0.08); border-left-color: var(--amber); }
    .note-title-small { font-size: 13px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .note-date-small { font-family: var(--font-mono); font-size: 10px; color: var(--text-faint); margin-top: 2px; }

    .note-article { max-width: 700px; }
    .note-article h1 { font-family: var(--font-display); font-size: 26px; font-weight: 700; color: var(--text-hi); letter-spacing: -0.02em; line-height: 1.2; margin-bottom: 10px; }
    .note-article .note-meta { font-family: var(--font-mono); font-size: 11px; color: var(--text-faint); margin-bottom: 20px; display: flex; gap: 12px; align-items: center; }
    .note-article .body { font-size: 15px; line-height: 1.75; color: var(--text); }
    .note-article .body p { margin: 0 0 14px; }
    .note-article .body b, .note-article .body strong { color: var(--text-hi); font-weight: 600; }

    /* Strategy display */
    .strategy-block {
      background: var(--bg2); border: 1px solid var(--border); border-radius: var(--r3);
      margin-bottom: 20px; overflow: hidden;
    }
    .strategy-block-header {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 16px; border-bottom: 1px solid var(--border);
      background: var(--bg3);
    }
    .strategy-block-body { padding: 14px 16px; }
    .if-clause {
      font-family: var(--font-mono); font-size: 12px;
      padding: 8px 12px; background: var(--bg); border: 1px solid var(--border);
      border-radius: var(--r); margin-bottom: 6px;
    }
    .if-clause .kw { color: var(--amber); font-weight: 500; }
    .if-clause .cond { color: var(--blue); }
    .if-clause .then { color: var(--green); }
  </style>
</head>
<body>
<nav class="nav">
  <a class="nav-brand" href="index.html">Energy<span class="nav-brand-dot">.</span>Trader</a>
  <ul class="nav-links">
    <li><a href="index.html">Dashboard</a></li>
    <li><a href="review.html">Review</a></li>
    <li><a href="notes.html" class="active">Notes</a></li>
    <li><a href="admin-lEqo0dka.html">Admin</a></li>
  </ul>
  <div class="nav-right"><button class="theme-toggle" id="theme-toggle" onclick="toggleTheme()"><span class="theme-toggle-icon" id="theme-icon">☀️</span><span id="theme-label">Light</span></button></div>
</nav>

<div class="page">
<div class="notes-layout">

  <!-- Sidebar -->
  <div class="notes-sidebar">
    <div class="tabs" style="margin-bottom:14px;border:none;gap:4px">
      <button class="tab-btn active" data-kind="note" onclick="setKind('note',this)" style="padding:5px 10px">Notes</button>
      <button class="tab-btn" data-kind="strategy" onclick="setKind('strategy',this)" style="padding:5px 10px">Strategies</button>
    </div>
    <div id="sidebar-list"></div>
  </div>

  <!-- Main -->
  <div class="notes-main">
    <div id="note-view">
      <div class="page-hero" style="padding-top:20px">
        <div class="page-hero-eyebrow">Journal</div>
        <h1 class="page-hero-title">Notes &<br>Strategies</h1>
        <p class="page-hero-sub">Learning log, market reflections, and trading strategies expressed as logical rules.</p>
      </div>
      <p class="text-dim">Select a note from the sidebar, or <a href="admin-lEqo0dka.html" class="text-amber">add a new one →</a></p>
    </div>
  </div>

</div>
</div>

<footer class="site-footer">© <span id="yr"></span> · Kevin Maresca</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/config.js"></script>
<script src="js/db.js"></script>
<script src="js/ui.js"></script>
<script>
document.getElementById('yr').textContent = new Date().getFullYear();

let currentKind = 'note';
let allNotes = [];

async function loadAll() {
  allNotes = await DB.listNotes();
  renderSidebar();
}

function setKind(kind, btn) {
  currentKind = kind;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderSidebar();
  document.getElementById('note-view').innerHTML = `<p class="text-dim text-sm">Select a ${kind} from the sidebar.</p>`;
}

function renderSidebar() {
  const notes = allNotes.filter(n => n.kind === currentKind);
  const el = document.getElementById('sidebar-list');
  if (!notes.length) {
    el.innerHTML = `<p class="text-faint text-sm">No ${currentKind}s yet. <a href="admin-lEqo0dka.html" class="text-amber">Add one →</a></p>`;
    return;
  }
  el.innerHTML = notes.map(n => `
    <div class="note-sidebar-item" id="nsb-${n.id}" onclick="viewNote('${n.id}')">
      <div class="note-title-small">${UI.escapeHtml(n.title)}</div>
      <div class="note-date-small">${new Date(n.created_at).toLocaleDateString()}</div>
    </div>`).join('');
}

function viewNote(id) {
  const n = allNotes.find(x => x.id === id);
  if (!n) return;

  document.querySelectorAll('.note-sidebar-item').forEach(el => el.classList.remove('active'));
  document.getElementById(`nsb-${id}`)?.classList.add('active');

  const el = document.getElementById('note-view');

  if (n.kind === 'note') {
    el.innerHTML = `<article class="note-article">
      <h1>${UI.escapeHtml(n.title)}</h1>
      <div class="note-meta">
        <span class="badge badge-dim">Note</span>
        <span>${new Date(n.created_at).toLocaleDateString('en-US', { weekday:'long', month:'long', day:'numeric', year:'numeric' })}</span>
        <a href="admin-lEqo0dka.html" class="text-amber text-xs">Edit →</a>
      </div>
      <div class="body">${n.body}</div>
    </article>`;
  } else {
    // Strategy: render as IF/THEN blocks
    el.innerHTML = `<article class="note-article">
      <h1>${UI.escapeHtml(n.title)}</h1>
      <div class="note-meta">
        <span class="badge badge-amber">Strategy</span>
        <span>${new Date(n.created_at).toLocaleDateString('en-US', { month:'long', day:'numeric', year:'numeric' })}</span>
        <a href="admin-lEqo0dka.html" class="text-amber text-xs">Edit →</a>
      </div>
      <div class="body">${n.body}</div>
    </article>`;
  }
}

loadAll();
</script>
<script>
function toggleTheme() {
  const next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  localStorage.setItem("et-theme", next);
  const icon = document.getElementById("theme-icon");
  const lbl  = document.getElementById("theme-label");
  if (icon) icon.textContent = next === "light" ? "🌙" : "☀️";
  if (lbl)  lbl.textContent  = next === "light" ? "Dark" : "Light";
}
// Sync button state with current theme on load
(function(){
  const t = localStorage.getItem("et-theme") || "dark";
  const icon = document.getElementById("theme-icon");
  const lbl  = document.getElementById("theme-label");
  if (icon) icon.textContent = t === "light" ? "🌙" : "☀️";
  if (lbl)  lbl.textContent  = t === "light" ? "Dark" : "Light";
})();
</script>
</body>
</html>
